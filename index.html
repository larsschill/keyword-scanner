<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTG Keyword Scanner</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #111318;
      --surface:  #1c1f27;
      --surface2: #252935;
      --border:   #2e3244;
      --gold:     #c9a84c;
      --gold-dim: #8a6e28;
      --text:     #dde1ec;
      --muted:    #7a7f99;
      --error:    #e05c6a;
      --radius:   10px;
    }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2.5rem 1rem 4rem;
    }

    .container { max-width: 860px; margin: 0 auto; }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 2.2rem;
      letter-spacing: .03em;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(201,168,76,.25);
      margin-bottom: .4rem;
    }
    header p { color: var(--muted); font-size: 1rem; }

    /* ── Card surface ───────────────────────────────────────── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem 1.5rem;
      margin-bottom: 1.25rem;
    }

    /* ── Hint text ──────────────────────────────────────────── */
    .hint {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: .65rem;
    }
    .hint strong { color: var(--text); }

    /* ── Textarea ───────────────────────────────────────────── */
    textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Consolas', 'SF Mono', monospace;
      font-size: .88rem;
      line-height: 1.5;
      padding: .75rem 1rem;
      resize: vertical;
      min-height: 180px;
      outline: none;
      transition: border-color .15s;
      display: block;
      margin-bottom: .75rem;
    }
    textarea:focus { border-color: var(--gold); }
    textarea::placeholder { color: var(--muted); }

    /* ── Button ─────────────────────────────────────────────── */
    .btn {
      background: var(--gold);
      border: none;
      border-radius: 8px;
      color: #110e00;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      padding: .7rem 1.5rem;
      transition: opacity .15s, transform .1s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { opacity: .88; }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    /* ── Status / error ─────────────────────────────────────── */
    .status {
      display: flex;
      align-items: center;
      gap: .6rem;
      color: var(--muted);
      font-size: .95rem;
      padding: .75rem 0 .25rem;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .75s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: rgba(224,92,106,.08);
      border: 1px solid rgba(224,92,106,.3);
      border-radius: var(--radius);
      color: var(--error);
      padding: .9rem 1.1rem;
      font-size: .95rem;
      margin-bottom: 1.25rem;
    }

    /* ── Deck meta bar ──────────────────────────────────────── */
    .deck-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: .75rem;
    }
    .badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: .8rem;
      padding: .2rem .75rem;
    }

    /* ── Keyword grid ───────────────────────────────────────── */
    .section-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .07em;
      margin-bottom: 1rem;
    }

    .kw-list { display: flex; flex-direction: column; gap: .6rem; }

    .kw-item {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .9rem 1.1rem;
      transition: border-color .15s;
    }
    .kw-item:hover { border-color: var(--surface2); }

    .kw-header {
      display: flex;
      align-items: center;
      gap: .6rem;
      margin-bottom: .45rem;
    }
    .kw-name {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--gold);
    }
    .kw-count {
      background: var(--surface2);
      border-radius: 12px;
      color: var(--muted);
      font-size: .78rem;
      padding: .12rem .55rem;
    }

    .kw-desc {
      color: var(--muted);
      font-size: .88rem;
      line-height: 1.55;
      margin-bottom: .5rem;
    }
    .kw-desc.unknown { font-style: italic; }
    .kw-desc a { color: var(--gold-dim); }

    details.kw-cards summary {
      font-size: .8rem;
      color: #5a5f7a;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    details.kw-cards summary::-webkit-details-marker { display: none; }
    details.kw-cards summary::before { content: '+ '; }
    details[open].kw-cards summary::before { content: '- '; }
    details.kw-cards summary:hover { color: var(--muted); }

    .card-pills {
      display: flex;
      flex-wrap: wrap;
      gap: .3rem;
      margin-top: .45rem;
    }
    .card-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: .76rem;
      padding: .15rem .6rem;
      color: var(--text);
    }

    .empty-msg {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }

    @media (max-width: 560px) {
      header h1 { font-size: 1.7rem; }
    }
  </style>
</head>

/* ────────────────────────────────────────────────────────────────
   HELPERS
──────────────────────────────────────────────────────────────── */
function h(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function findExplanation(keyword) {
  if (KW[keyword]) return KW[keyword];
  const lower = keyword.toLowerCase();
  for (const [k, v] of Object.entries(KW))
    if (k.toLowerCase() === lower) return v;
  // Strip trailing number/cost e.g. "Ward 2" → "Ward"
  const base = keyword.replace(/\s+[\w{}/]+$/, '').trim();
  if (base && base !== keyword) return findExplanation(base);
  return null;
}

// Parse MTGO / Arena / plain deck list format into unique card names.
// Handles:
//   "1 Card Name"        — standard quantity prefix
//   "4x Card Name"       — x-suffix quantity
//   "1 Card Name (SET) 123" — with set/collector number
//   "1 Card Name *CMDR*" — with commander tag
//   "Card Name"          — no quantity
function parseDeckText(text) {
  const names = new Set();
  for (const rawLine of text.split('\n')) {
    const line = rawLine.trim();
    if (!line || line.startsWith('//') || line.startsWith('#')) continue;
    const name = line
      .replace(/^\d+x?\s+/, '')              // strip leading quantity
      .replace(/\s*\*[^*]+\*\s*/g, '')       // strip *CMDR* etc.
      .replace(/\s*\([A-Z0-9]+\)\s*\d*$/, '') // strip (SET) 123
      .trim();
    if (name) names.add(name);
  }
  return [...names];
}

  const cards = [];
  const SIZE = 75;
  for (let i = 0; i < names.length; i += SIZE) {
    const batch = names.slice(i, i + SIZE);
    const res = await fetch('https://api.scryfall.com/cards/collection', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identifiers: batch.map(n => ({ name: n })) }),
    });
    if (!res.ok) throw new Error(`Scryfall returned HTTP ${res.status}.`);
    const data = await res.json();
    cards.push(...(data.data || []));
    if (i + SIZE < names.length) await sleep(100);
  }
  return cards;
}

function collectKeywords(cards) {
  const map = new Map();
  for (const card of cards) {
    const kws = new Set([...(card.keywords || [])]);
    if (card.card_faces)
      for (const f of card.card_faces)
        for (const k of (f.keywords || [])) kws.add(k);

    for (const kw of kws) {
      if (!map.has(kw)) map.set(kw, { cardNames: new Set(), explanation: findExplanation(kw) });
      map.get(kw).cardNames.add(card.name);
    }
  }
  return map;
}

/* ────────────────────────────────────────────────────────────────
   RENDER
──────────────────────────────────────────────────────────────── */
function renderResults(totalUnique, kwMap) {
  const area = document.getElementById('resultsArea');
  if (kwMap.size === 0) {
    area.innerHTML = `<div class="panel"><div class="empty-msg">No keyword abilities found in this deck.</div></div>`;
    return;
  }

  const sorted  = [...kwMap.entries()].sort((a, b) => b[1].cardNames.size - a[1].cardNames.size);
  const kwCount = kwMap.size;

  let rows = '';
  for (const [kw, { cardNames, explanation }] of sorted) {
    const n = cardNames.size;
    const pills = [...cardNames].sort().map(c => `<span class="card-pill">${h(c)}</span>`).join('');
    const desc = explanation
      ? `<div class="kw-desc">${h(explanation)}</div>`
      : `<div class="kw-desc unknown">No explanation available — see the <a href="https://magic.wizards.com/en/rules" target="_blank" rel="noopener">MTG Comprehensive Rules</a>.</div>`;

    rows += `
    <div class="kw-item">
      <div class="kw-header">
        <span class="kw-name">${h(kw)}</span>
        <span class="kw-count">${n} card${n !== 1 ? 's' : ''}</span>
      </div>
      ${desc}
      <details class="kw-cards">
        <summary>Show cards with ${h(kw)}</summary>
        <div class="card-pills">${pills}</div>
      </details>
    </div>`;
  }

  area.innerHTML = `
  <div class="panel">
    <div class="deck-meta">
      <span class="badge">${totalUnique} unique cards scanned</span>
      <span class="badge">${kwCount} keyword${kwCount !== 1 ? 's' : ''} found</span>
    </div>
  </div>
  <div class="panel">
    <div class="section-title">Keywords — sorted by frequency</div>
    <div class="kw-list">${rows}</div>
  </div>`;
}

/* ────────────────────────────────────────────────────────────────
   FORM HANDLER
──────────────────────────────────────────────────────────────── */
document.getElementById('deckForm').addEventListener('submit', async e => {
  e.preventDefault();

  const text    = document.getElementById('deckText').value;
  const btn     = document.getElementById('submitBtn');
  const status  = document.getElementById('statusArea');
  const results = document.getElementById('resultsArea');

  results.innerHTML = '';

  const names = parseDeckText(text);
  if (names.length === 0) {
    status.innerHTML = `<div class="error-box">No card names found. Paste your deck list with one card per line (e.g. <strong>1 Lightning Bolt</strong>).</div>`;
    return;
  }

  btn.disabled = true;
  status.innerHTML = `<div class="panel"><div class="status"><span class="spinner"></span>Found ${names.length} unique card${names.length !== 1 ? 's' : ''} — fetching keyword data from Scryfall&hellip;</div></div>`;

  try {
    const cards = await fetchScryfallCards(names);
    const kwMap = collectKeywords(cards);
    status.innerHTML = '';
    renderResults(names.length, kwMap);
  } catch (err) {
    status.innerHTML = `<div class="error-box">${h(err.message)}</div>`;
  } finally {
    btn.disabled = false;
  }
});
</script>
